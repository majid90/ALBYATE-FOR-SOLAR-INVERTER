
name: Build ALBYATE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.38.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          cache: true

      - name: Locate and extract ALBYATE source
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "$GITHUB_WORKSPACE/pubspec.yaml" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            mapfile -t ZIP_FILES < <(
              find "$GITHUB_WORKSPACE" -maxdepth 1 -type f \
                -iname 'ALBYATE*.zip' ! -iname '*apk*' -print
            )

            if [[ "${#ZIP_FILES[@]}" -ne 1 ]]; then
              echo "ERROR: Expected exactly one ALBYATE source ZIP."
              printf '%s\n' "${ZIP_FILES[@]:-No ZIP found}"
              exit 1
            fi

            EXTRACT_DIR="$RUNNER_TEMP/albyate-source"
            mkdir -p "$EXTRACT_DIR"
            unzip -q "${ZIP_FILES[0]}" -d "$EXTRACT_DIR"

            PUBSPEC_PATH="$(find "$EXTRACT_DIR" -maxdepth 6 \
              -type f -name pubspec.yaml -print -quit)"

            if [[ -z "$PUBSPEC_PATH" ]]; then
              echo "ERROR: pubspec.yaml not found."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PUBSPEC_PATH")"
          fi

          test -f "$PROJECT_DIR/android/settings.gradle.kts"
          test -f "$PROJECT_DIR/android/app/build.gradle.kts"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using project: $PROJECT_DIR"

      - name: Restore Gradle Wrapper
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          WRAPPER_DIR="android/gradle/wrapper"
          mkdir -p "$WRAPPER_DIR"

          if [[ ! -s android/gradlew ||
                ! -s "$WRAPPER_DIR/gradle-wrapper.jar" ||
                ! -s "$WRAPPER_DIR/gradle-wrapper.properties" ]]; then

            TEMPLATE_DIR="$(mktemp -d)"

            flutter create \
              --platforms=android \
              --org com.albyate \
              --project-name albyate_wrapper_template \
              "$TEMPLATE_DIR/template"

            cp "$TEMPLATE_DIR/template/android/gradlew" android/
            cp "$TEMPLATE_DIR/template/android/gradlew.bat" android/

            cp "$TEMPLATE_DIR/template/android/gradle/wrapper/gradle-wrapper.jar" \
              "$WRAPPER_DIR/"

            cp "$TEMPLATE_DIR/template/android/gradle/wrapper/gradle-wrapper.properties" \
              "$WRAPPER_DIR/"
          fi

          chmod +x android/gradlew

          sed -i -E \
            's#^distributionUrl=.*$#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-all.zip#' \
            "$WRAPPER_DIR/gradle-wrapper.properties"

          test -s android/gradlew
          test -s "$WRAPPER_DIR/gradle-wrapper.jar"
          test -s "$WRAPPER_DIR/gradle-wrapper.properties"

      - name: Verify Android versions
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          grep -Fq 'version "8.11.1"' android/settings.gradle.kts
          grep -Fq 'version "2.2.20"' android/settings.gradle.kts
          grep -Fq 'gradle-8.14.3-all.zip' \
            android/gradle/wrapper/gradle-wrapper.properties

          echo "AGP 8.11.1"
          echo "Kotlin 2.2.20"
          echo "Gradle 8.14.3"

          java -version
          flutter --version

      - name: Get Flutter dependencies
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Analyze Flutter project
        continue-on-error: true
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-pub

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter build apk --debug --no-pub --verbose \
            2>&1 | tee "$RUNNER_TEMP/albyate-build.log"

          APK="build/app/outputs/flutter-apk/app-debug.apk"

          test -s "$APK"

          echo "APK BUILD SUCCESSFUL"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALBYATE-v0.3.2-debug-APK
          path: ${{ steps.project.outputs.project_dir }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALBYATE-build-log
          path: ${{ runner.temp }}/albyate-build.log
          if-no-files-found: ignore
          retention-days: 7
