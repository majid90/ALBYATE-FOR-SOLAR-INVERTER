
name: Build ALBYATE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.38.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          cache: true

      - name: Locate or extract ALBYATE project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$GITHUB_WORKSPACE/pubspec.yaml" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            mapfile -t ZIP_FILES < <(
              find "$GITHUB_WORKSPACE" -maxdepth 1 -type f \
                -iname 'ALBYATE*.zip' ! -iname '*apk*' -print
            )
            if [[ ${#ZIP_FILES[@]} -ne 1 ]]; then
              echo "ERROR: Expected exactly one ALBYATE source ZIP."
              printf 'Found: %s\n' "${ZIP_FILES[@]:-none}"
              exit 1
            fi
            EXTRACT_DIR="$RUNNER_TEMP/albyate-source"
            mkdir -p "$EXTRACT_DIR"
            unzip -q "${ZIP_FILES[0]}" -d "$EXTRACT_DIR"
            PUBSPEC_PATH="$(find "$EXTRACT_DIR" -maxdepth 6 -type f -name pubspec.yaml -print -quit)"
            if [[ -z "$PUBSPEC_PATH" ]]; then
              echo "ERROR: pubspec.yaml was not found inside the ZIP."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$PUBSPEC_PATH")"
          fi
          if [[ ! -d "$PROJECT_DIR/android" ]]; then
            echo "ERROR: Android project directory not found."
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Repair Gradle Wrapper
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          WRAPPER_DIR="android/gradle/wrapper"
          mkdir -p "$WRAPPER_DIR"
          if [[ ! -f android/gradlew || ! -f "$WRAPPER_DIR/gradle-wrapper.jar" || ! -f "$WRAPPER_DIR/gradle-wrapper.properties" ]]; then
            TMP_DIR="$(mktemp -d)"
            flutter create --platforms=android --org com.albyate --project-name albyate_for_solar_inverter "$TMP_DIR/scaffold"
            cp "$TMP_DIR/scaffold/android/gradlew" android/gradlew
            cp "$TMP_DIR/scaffold/android/gradle/wrapper/gradle-wrapper.jar" "$WRAPPER_DIR/"
            cp "$TMP_DIR/scaffold/android/gradle/wrapper/gradle-wrapper.properties" "$WRAPPER_DIR/"
          fi
          sed -i -E 's#^distributionUrl=.*$#distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-all.zip#' "$WRAPPER_DIR/gradle-wrapper.properties"
          chmod +x android/gradlew
          test -s "$WRAPPER_DIR/gradle-wrapper.jar"
          test -s "$WRAPPER_DIR/gradle-wrapper.properties"
          grep -E 'com.android.application|org.jetbrains.kotlin.android' android/settings.gradle.kts

      - name: Install Flutter dependencies
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter --version
          flutter pub get

      - name: Analyze Flutter project
        continue-on-error: true
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-pub

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          flutter build apk --debug --no-pub --verbose 2>&1 | tee "$RUNNER_TEMP/albyate-build.log"
          test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALBYATE-v0.3.2-debug-APK
          path: ${{ steps.project.outputs.project_dir }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALBYATE-build-diagnostics
          path: ${{ runner.temp }}/albyate-build.log
          if-no-files-found: ignore
          retention-days: 7
