
name: Build ALBYATE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter 3.38.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          cache: true

      - name: Extract ALBYATE project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find . -maxdepth 1 -type f \
              -iname 'ALBYATE*.zip' \
              ! -iname '*apk*' -print
          )

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one ALBYATE ZIP."
            printf '%s\n' "${ZIP_FILES[@]:-No ZIP found}"
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/albyate-source"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "${ZIP_FILES[0]}" -d "$EXTRACT_DIR"

          PUBSPEC="$(find "$EXTRACT_DIR" \
            -maxdepth 6 -type f \
            -name pubspec.yaml -print -quit)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          test -f "$PROJECT_DIR/android/settings.gradle.kts"
          test -f "$PROJECT_DIR/android/app/build.gradle.kts"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Project found: $PROJECT_DIR"

      - name: Restore Gradle Wrapper
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          WRAPPER_DIR="android/gradle/wrapper"
          mkdir -p "$WRAPPER_DIR"

          if [[ ! -s android/gradlew ||
                ! -s "$WRAPPER_DIR/gradle-wrapper.jar" ||
                ! -s "$WRAPPER_DIR/gradle-wrapper.properties" ]]; then

            TEMP_DIR="$(mktemp -d)"

            flutter create \
              --platforms=android \
              --org com.albyate \
              --project-name albyate_wrapper_template \
              "$TEMP_DIR/template"

            cp "$TEMP_DIR/template/android/gradlew" android/
            cp "$TEMP_DIR/template/android/gradlew.bat" android/

            cp "$TEMP_DIR/template/android/gradle/wrapper/gradle-wrapper.jar" \
              "$WRAPPER_DIR/"

            cp "$TEMP_DIR/template/android/gradle/wrapper/gradle-wrapper.properties" \
              "$WRAPPER_DIR/"
          fi

          chmod +x android/gradlew

          sed -i -E \
            's#^distributionUrl=.*$#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-all.zip#' \
            "$WRAPPER_DIR/gradle-wrapper.properties"

          test -s android/gradlew
          test -s "$WRAPPER_DIR/gradle-wrapper.jar"
          test -s "$WRAPPER_DIR/gradle-wrapper.properties"

          echo "Gradle Wrapper ready."

      - name: Verify project versions
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          grep -q '8.11.1' android/settings.gradle.kts
          grep -q '2.1.0' android/settings.gradle.kts
          grep -q 'gradle-8.14.3-all.zip' \
            android/gradle/wrapper/gradle-wrapper.properties

          echo "AGP: 8.11.1"
          echo "Kotlin: 2.1.0"
          echo "Gradle: 8.14.3"

          java -version
          flutter --version

      - name: Get Flutter dependencies
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter pub get

      - name: Analyze Flutter project
        continue-on-error: true
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          cd "$PROJECT_DIR"

          flutter analyze --no-pub

      - name: Build ALBYATE APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter build apk --debug --no-pub

          APK="build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK BUILD SUCCESSFUL"
          ls -lh "$APK"

      - name: Upload ALBYATE APK
        uses: actions/upload-artifact@v4
        with:
          name: ALBYATE-v0.3.2-debug-APK
          path: ${{ steps.project.outputs.project_dir }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALBYATE-build-diagnostics
          path: |
            ${{ runner.temp }}/albyate-source
          if-no-files-found: ignore
          retention-days: 3
