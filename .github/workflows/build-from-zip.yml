name: Build APK From ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ALBYATE project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="ALBYATE_v0_3_2_READY_FOR_GITHUB.zip"
          test -f "$ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          test -f extracted/pubspec.yaml
          test -f extracted/android/settings.gradle.kts
          cp -a extracted/. ./
          rm -rf extracted

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/gradlew ] || \
             [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            flutter create --no-pub \
              --platforms=android \
              --org com.albyate \
              --project-name albyate_for_solar_inverter \
              /tmp/albyate_scaffold
            cp /tmp/albyate_scaffold/android/gradlew android/gradlew
            cp /tmp/albyate_scaffold/android/gradlew.bat android/gradlew.bat
            mkdir -p android/gradle/wrapper
            cp /tmp/albyate_scaffold/android/gradle/wrapper/gradle-wrapper.jar \
              android/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x android/gradlew

      - name: Fix Gradle and Android plugin
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"
          SETTINGS="android/settings.gradle.kts"

          sed -i -E \
            's#gradle-[0-9.]+-(all|bin)\.zip#gradle-8.14-all.zip#g' \
            "$WRAPPER"

          sed -i -E \
            's/(id\("com.android.application"\) version ")[^"]+/\18.11.1/' \
            "$SETTINGS"

          grep 'gradle-8.14-all.zip' "$WRAPPER"
          grep 'com.android.application' "$SETTINGS"

      - name: Show environment
        run: |
          flutter --version
          java -version
          cd android
          ./gradlew --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build-apk.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ALBYATE-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ALBYATE-Build-Errors
          path: build-apk.log
          if-no-files-found: ignore
