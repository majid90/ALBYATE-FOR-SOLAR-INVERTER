
name: Build ALBYATE APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="ALBYATE_v0_3_2_READY_FOR_GITHUB.zip"
          test -f "$ZIP"
          mkdir -p /tmp/albyate_source
          unzip -q "$ZIP" -d /tmp/albyate_source
          test -f /tmp/albyate_source/pubspec.yaml
          test -f /tmp/albyate_source/android/settings.gradle.kts
          cp -a /tmp/albyate_source/. ./

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare compatible Android build tools
        shell: bash
        run: |
          set -euo pipefail

          flutter create --no-pub \
            --platforms=android \
            --org com.albyate \
            --project-name albyate_for_solar_inverter \
            /tmp/albyate_template

          python3 - <<'PY'
          import re
          from pathlib import Path

          original = Path("android")
          template = Path("/tmp/albyate_template/android")

          src = (template / "settings.gradle.kts").read_text()
          dst_path = original / "settings.gradle.kts"
          dst = dst_path.read_text()

          for plugin in (
              "com.android.application",
              "org.jetbrains.kotlin.android",
          ):
              pattern = (
                  r'id\("' + re.escape(plugin) +
                  r'"\)\s+version\s+"([^"]+)"'
              )
              found = re.search(pattern, src)
              if not found:
                  raise RuntimeError(
                      "Missing template plugin: " + plugin
                  )
              version = found.group(1)
              dst, count = re.subn(
                  pattern,
                  lambda m: m.group(0).replace(
                      m.group(1), version
                  ),
                  dst,
                  count=1,
              )
              if count != 1:
                  raise RuntimeError(
                      "Missing project plugin: " + plugin
                  )
              print(plugin, version)

          dst_path.write_text(dst)

          wrapper = original / "gradle/wrapper"
          template_wrapper = template / "gradle/wrapper"
          wrapper.mkdir(parents=True, exist_ok=True)

          import shutil
          for name in (
              "gradlew",
              "gradlew.bat",
          ):
              shutil.copy2(template / name, original / name)

          for name in (
              "gradle-wrapper.jar",
              "gradle-wrapper.properties",
          ):
              shutil.copy2(
                  template_wrapper / name,
                  wrapper / name,
              )

          print(
              (wrapper / "gradle-wrapper.properties")
              .read_text()
          )
          PY

          chmod +x android/gradlew

      - name: Verify versions
        shell: bash
        run: |
          flutter --version
          java -version
          grep 'com.android.application' \
            android/settings.gradle.kts
          grep 'org.jetbrains.kotlin.android' \
            android/settings.gradle.kts
          cd android
          ./gradlew --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug \
            2>&1 | tee build-apk.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ALBYATE-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ALBYATE-BUILD-ERRORS
          path: |
            build-apk.log
            android/settings.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: ignore
