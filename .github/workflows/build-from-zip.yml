
name: Build ALBYATE APK - Kotlin 2.4.21

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract ALBYATE project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="ALBYATE_v0_3_2_KOTLIN_2_4_21_FIX.zip"

          if [[ ! -f "$ZIP" ]]; then
            echo "ERROR: ZIP not found: $ZIP"
            ls -la
            exit 1
          fi

          SRC_DIR="$RUNNER_TEMP/albyate-zip-source"
          mkdir -p "$SRC_DIR"
          unzip -q "$ZIP" -d "$SRC_DIR"

          PUBSPEC_PATH="$(find "$SRC_DIR" -maxdepth 6 -name pubspec.yaml -print -quit)"

          if [[ -z "$PUBSPEC_PATH" ]]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC_PATH")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -d "$PROJECT_DIR/android"
          test -d "$PROJECT_DIR/lib"

      - name: Restore Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          flutter create --no-pub --platforms=android \
            --org com.albyate \
            --project-name albyate_for_solar_inverter \
            "$RUNNER_TEMP/albyate-wrapper-template"

          mkdir -p "$PROJECT_DIR/android/gradle/wrapper"

          cp "$RUNNER_TEMP/albyate-wrapper-template/android/gradlew" \
            "$PROJECT_DIR/android/gradlew"

          cp "$RUNNER_TEMP/albyate-wrapper-template/android/gradlew.bat" \
            "$PROJECT_DIR/android/gradlew.bat"

          cp "$RUNNER_TEMP/albyate-wrapper-template/android/gradle/wrapper/gradle-wrapper.jar" \
            "$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.jar"

          chmod +x "$PROJECT_DIR/android/gradlew"

      - name: Verify Android and Kotlin versions
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          grep -q 'com.android.application.*8.11.1' android/settings.gradle.kts
          grep -q 'org.jetbrains.kotlin.android.*2.4.21' android/settings.gradle.kts
          grep -q 'gradle-8.14-all.zip' android/gradle/wrapper/gradle-wrapper.properties

          java -version
          flutter --version
          android/gradlew --version

      - name: Install Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Record Android dependencies
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${PROJECT_DIR:-}" && -d "$PROJECT_DIR/android" ]]; then
            cd "$PROJECT_DIR/android"
            ./gradlew :app:dependencies \
              --configuration debugRuntimeClasspath \
              > "$RUNNER_TEMP/albyate-android-dependencies.txt" 2>&1
          fi
          exit 0

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"

          flutter build apk --debug \
            2>&1 | tee "$RUNNER_TEMP/albyate-build.log"

          test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ALBYATE-v0.3.2-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ALBYATE-BUILD-DIAGNOSTICS
          path: |
            ${{ runner.temp }}/albyate-build.log
            ${{ runner.temp }}/albyate-android-dependencies.txt
          if-no-files-found: ignore
          retention-days: 14
