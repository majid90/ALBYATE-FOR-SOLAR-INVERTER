
name: Build ALBYATE APK From Repaired ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract repaired project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="ALBYATE_v0_3_2_REPAIRED_v2.zip"

          test -f "$ZIP" || {
            echo "ERROR: Repaired ZIP not found"
            exit 1
          }

          mkdir -p /tmp/albyate_repaired
          unzip -q "$ZIP" -d /tmp/albyate_repaired

          test -f /tmp/albyate_repaired/pubspec.yaml
          test -f /tmp/albyate_repaired/android/settings.gradle.kts
          test -f /tmp/albyate_repaired/android/app/build.gradle.kts

          cp -a /tmp/albyate_repaired/. ./

          echo "Repaired project extracted successfully"

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          flutter create --no-pub \
            --platforms=android \
            --org com.albyate \
            --project-name albyate_for_solar_inverter \
            /tmp/albyate_scaffold

          mkdir -p android/gradle/wrapper

          cp /tmp/albyate_scaffold/android/gradlew \
            android/gradlew

          cp /tmp/albyate_scaffold/android/gradlew.bat \
            android/gradlew.bat

          cp /tmp/albyate_scaffold/android/gradle/wrapper/gradle-wrapper.jar \
            android/gradle/wrapper/gradle-wrapper.jar

          chmod +x android/gradlew

      - name: Verify project configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Android Gradle Plugin:"
          grep 'com.android.application' \
            android/settings.gradle.kts

          echo "Kotlin:"
          grep 'org.jetbrains.kotlin.android' \
            android/settings.gradle.kts

          echo "Firebase Auth override:"
          grep 'firebase-auth:23.2.1' \
            android/app/build.gradle.kts

          echo "Gradle:"
          cat android/gradle/wrapper/gradle-wrapper.properties

          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Check Firebase dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd android

          ./gradlew :app:dependencies \
            --configuration debugRuntimeClasspath \
            > ../resolved-dependencies.txt

          grep 'firebase-auth' \
            ../resolved-dependencies.txt || true

          if grep -E \
            'com.google.firebase:firebase-auth:25\.[0-9.]+$' \
            ../resolved-dependencies.txt; then
            echo "ERROR: Incompatible Firebase Auth resolved"
            exit 1
          fi

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail

          flutter build apk --debug \
            2>&1 | tee build-apk.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ALBYATE-v0.3.2-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ALBYATE-BUILD-DIAGNOSTICS
          path: |
            build-apk.log
            resolved-dependencies.txt
            android/settings.gradle.kts
            android/app/build.gradle.kts
          if-no-files-found: ignore
