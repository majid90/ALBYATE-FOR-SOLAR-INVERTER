
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract ALBYATE project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t zips < <(
            find . -maxdepth 1 -type f \
              -name 'ALBYATE*.zip' \
              ! -iname '*apk*' -print
          )

          if [ "${#zips[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one source ZIP."
            printf '%s\n' "${zips[@]}"
            exit 1
          fi

          PROJECT_DIR="$RUNNER_TEMP/albyate-project"
          mkdir -p "$PROJECT_DIR"

          unzip -q "${zips[0]}" -d "$PROJECT_DIR"

          PUBSPEC="$(find "$PROJECT_DIR" \
            -maxdepth 4 -name pubspec.yaml -print -quit)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Restore Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          TMP_DIR="$(mktemp -d)"

          flutter create \
            --platforms=android \
            --org com.albyate \
            --project-name albyate_for_solar_inverter \
            "$TMP_DIR/scaffold"

          cp "$TMP_DIR/scaffold/android/gradlew" android/
          cp "$TMP_DIR/scaffold/android/gradlew.bat" android/

          mkdir -p android/gradle/wrapper

          cp "$TMP_DIR/scaffold/android/gradle/wrapper/gradle-wrapper.jar" \
            android/gradle/wrapper/

          chmod +x android/gradlew

          echo "Gradle Wrapper restored."

      - name: Set Gradle 8.14.3
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          PROPERTIES="android/gradle/wrapper/gradle-wrapper.properties"

          sed -i -E \
            's#^distributionUrl=.*$#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-all.zip#' \
            "$PROPERTIES"

          grep 'distributionUrl' "$PROPERTIES"

          grep -q 'gradle-8.14.3-all.zip' "$PROPERTIES"

          android/gradlew --version

      - name: Verify Android configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          echo "Android plugin:"
          grep -n 'com.android.application' android/settings.gradle.kts

          echo "Kotlin plugin:"
          grep -n 'org.jetbrains.kotlin.android' android/settings.gradle.kts

          echo "Java:"
          java -version

          echo "Flutter:"
          flutter --version

          echo "Gradle:"
          android/gradlew --version

      - name: Install Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter build apk --debug

          test -f build/app/outputs/flutter-apk/app-debug.apk

          echo "APK BUILD SUCCESSFUL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALBYATE-v0.3.2-debug-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALBYATE-build-diagnostics
          path: |
            ${{ env.PROJECT_DIR }}/android/settings.gradle.kts
            ${{ env.PROJECT_DIR }}/android/gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: ignore
          retention-days: 7
