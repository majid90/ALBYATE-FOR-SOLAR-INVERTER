
name: Build ALBYATE APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="ALBYATE_v0_3_2_READY_FOR_GITHUB.zip"
          test -f "$ZIP"
          mkdir -p /tmp/albyate
          unzip -q "$ZIP" -d /tmp/albyate
          test -f /tmp/albyate/pubspec.yaml
          test -f /tmp/albyate/android/settings.gradle.kts
          cp -a /tmp/albyate/. ./

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Android build tools
        shell: bash
        run: |
          set -euo pipefail

          flutter create --no-pub \
            --platforms=android \
            --org com.albyate \
            --project-name albyate_for_solar_inverter \
            /tmp/albyate_template

          cp /tmp/albyate_template/android/gradlew android/gradlew
          cp /tmp/albyate_template/android/gradlew.bat android/gradlew.bat

          mkdir -p android/gradle/wrapper

          cp /tmp/albyate_template/android/gradle/wrapper/gradle-wrapper.jar \
            android/gradle/wrapper/gradle-wrapper.jar

          chmod +x android/gradlew

          python3 - <<'PY'
          import re
          from pathlib import Path

          wrapper = Path(
              "android/gradle/wrapper/gradle-wrapper.properties"
          )
          settings = Path("android/settings.gradle.kts")

          text = wrapper.read_text()
          text, count = re.subn(
              r"gradle-[0-9.]+-(?:all|bin)\.zip",
              "gradle-8.14-all.zip",
              text,
          )
          if count != 1:
              raise RuntimeError("Gradle wrapper version not found")
          wrapper.write_text(text)

          text = settings.read_text()

          versions = {
              "com.android.application": "8.11.1",
              "org.jetbrains.kotlin.android": "2.2.20",
          }

          for plugin, version in versions.items():
              pattern = (
                  r'(id\("' + re.escape(plugin) +
                  r'"\)\s+version\s+")[^"]+(")'
              )
              text, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + version + m.group(2),
                  text,
              )
              if count != 1:
                  raise RuntimeError(
                      "Plugin declaration not found: " + plugin
                  )

          settings.write_text(text)

          print(wrapper.read_text())
          print(settings.read_text())
          PY

      - name: Check versions
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          java -version
          cd android
          ./gradlew --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug \
            2>&1 | tee build-apk.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ALBYATE-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ALBYATE-BUILD-ERRORS
          path: |
            build-apk.log
            android/settings.gradle.kts
            android/app/build.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: ignore
