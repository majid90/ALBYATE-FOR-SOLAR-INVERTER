publish_to: 'none'
version: 0.3.2+5

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  mobile_scanner: ^7.0.1
  google_mlkit_text_recognition: ^0.15.0
  intl: ^0.20.2
